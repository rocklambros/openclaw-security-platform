[project]
name = "openclaw-security-platform"
version = "0.1.0"
description = "Pluggable security evaluator platform for OpenClaw"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "uvicorn>=0.32.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "pysigma>=0.11.0",
    "cel-python>=0.5.0",
    "onnxruntime>=1.20.0",
    "anthropic>=0.42.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
openclaw-security = "openclaw_security.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests that require the OpenClaw gateway and Anthropic API (deselect with '-m \"not slow\"')",
]
