evaluators:
  - name: secret-write-guard
    type: regex
    stages: [tool.before]
    rules:
      - label: API key outside safe path
        patterns:
          - pattern: "(?i)(api[_-]?key|secret[_-]?key|access[_-]?token)\\s*[:=]\\s*['\"]?[A-Za-z0-9]{20,}"
            field: tool_args.content
          - pattern: "^/safe/"
            field: tool_args.file_path
            negate: true
        match: all
        action: block
