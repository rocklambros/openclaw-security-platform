# Default regex rules — secret / credential detection
#
# These patterns catch the most common credential leaks in tool
# arguments and outputs.

- label: AWS Access Key ID
  pattern: "AKIA[0-9A-Z]{16}"
  action: redact

- label: AWS Secret Access Key
  pattern: "(?i)aws_secret_access_key\\s*[:=]\\s*[A-Za-z0-9/+=]{40}"
  action: redact

- label: GitHub Personal Access Token
  pattern: "ghp_[A-Za-z0-9]{36}"
  action: redact

- label: GitHub OAuth Token
  pattern: "gho_[A-Za-z0-9]{36}"
  action: redact

- label: Slack Bot Token
  pattern: "xoxb-[0-9]{10,13}-[0-9]{10,13}-[A-Za-z0-9]{24}"
  action: redact

- label: Slack Webhook URL
  pattern: "https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+"
  action: redact

- label: Google API Key
  pattern: "AIza[0-9A-Za-z_-]{35}"
  action: redact

- label: Private Key Block
  pattern: "-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----"
  action: block

- label: Generic High-Entropy Secret Assignment
  pattern: "(?i)(password|passwd|secret|token|api_key)\\s*[:=]\\s*['\"]?[A-Za-z0-9!@#$%^&*]{16,}"
  action: warn

- label: Social Security Number (US)
  pattern: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
  action: redact

- label: Credit Card Number (Visa/MC/Amex)
  pattern: "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13})\\b"
  action: redact
