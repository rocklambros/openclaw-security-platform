<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #16161f;
      --bg-card-hover: #1c1c28;
      --border: #2a2a3a;
      --border-subtle: #1e1e2e;
      --text-primary: #e8e8f0;
      --text-secondary: #a0a0b8;
      --text-muted: #6a6a80;
      --accent: #ff6b5e;
      --accent-hover: #ff8577;
      --accent-glow: rgba(255, 107, 94, 0.15);
      --accent-glow-strong: rgba(255, 107, 94, 0.3);
      --code-bg: #1a1a25;
      --code-border: #2a2a3a;
      --success: #4ade80;
      --warning: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Hero ──────────────────────────────────────── */
    .hero {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 2rem;
      position: relative;
    }

    .hero-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .hero h1 .accent { color: var(--accent); }

    .hero .subtitle {
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      color: var(--text-secondary);
      max-width: 640px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 20px var(--accent-glow-strong);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 30px var(--accent-glow-strong);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--bg-card-hover);
      border-color: var(--text-muted);
      transform: translateY(-1px);
    }

    /* ── Sections ─────────────────────────────────── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    section {
      padding: 5rem 0;
    }

    section + section {
      border-top: 1px solid var(--border-subtle);
    }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
    }

    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .section-desc {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 600px;
      margin-bottom: 3rem;
    }

    /* ── Chain visual ─────────────────────────────── */
    .chain-flow {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex-wrap: wrap;
      padding: 1.5rem 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 2rem 0;
      overflow-x: auto;
    }

    .chain-step {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .chain-step .time {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .chain-arrow {
      color: var(--text-muted);
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    /* ── Cards grid ───────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem;
      transition: all 0.25s ease;
    }

    .card:hover {
      border-color: #3a3a4a;
      background: var(--bg-card-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .card .card-icon {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .card h3 {
      margin-bottom: 0.25rem;
    }

    .card .card-type {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .card p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    /* ── Code blocks ──────────────────────────────── */
    pre {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin: 1rem 0;
    }

    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
    }

    :not(pre) > code {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      padding: 0.15em 0.4em;
      border-radius: 5px;
      color: var(--accent);
    }

    /* ── Stage table ──────────────────────────────── */
    .stage-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }

    .stage-table th,
    .stage-table td {
      padding: 0.85rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid var(--border-subtle);
    }

    .stage-table th {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .stage-table td:first-child {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--accent);
    }

    .stage-table td {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* ── Architecture diagram ─────────────────────── */
    .arch-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem;
      margin: 2rem 0;
    }

    .arch-box pre {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* ── Steps ────────────────────────────────────── */
    .steps {
      display: grid;
      gap: 1.5rem;
      counter-reset: step;
    }

    .step {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
    }

    .step-num {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--accent-glow);
      border: 1px solid rgba(255, 107, 94, 0.3);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .step-content h3 {
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }

    .step-content p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .step-content code {
      font-size: 0.82rem;
    }

    /* ── Footer ───────────────────────────────────── */
    footer {
      padding: 3rem 0;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }
    footer a:hover { color: var(--accent); }

    /* ── Links ────────────────────────────────────── */
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    /* ── Responsive ───────────────────────────────── */
    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      .chain-flow { flex-direction: column; align-items: flex-start; }
      .chain-arrow { transform: rotate(90deg); }
      section { padding: 3rem 0; }
    }
  </style>
</head>
<body>

{{ content }}

</body>
</html>
