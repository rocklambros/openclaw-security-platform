<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Security — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --bg-row: #16161f;
      --bg-row-hover: #1c1c28;
      --border: #2a2a3a;
      --border-subtle: #1e1e2e;
      --text: #e8e8f0;
      --text-secondary: #a0a0b8;
      --text-muted: #6a6a80;
      --accent: #ff6b5e;
      --green: #4ade80;
      --red: #f87171;
      --amber: #fbbf24;
      --blue: #60a5fa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-card);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header h1 span { color: var(--accent); }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Stats row ─────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      padding: 1.5rem 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1.25rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-value.green { color: var(--green); }
    .stat-value.red { color: var(--red); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.blue { color: var(--blue); }

    /* ── Toolbar ───────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .toolbar label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .toolbar select, .toolbar input[type="text"], .toolbar input[type="datetime-local"] {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.8rem;
      padding: 0.4rem 0.6rem;
      font-family: 'JetBrains Mono', monospace;
      color-scheme: dark;
    }

    .toolbar select:focus, .toolbar input[type="text"]:focus, .toolbar input[type="datetime-local"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .filter-checks {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-checks label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      padding: 0.25rem 0.5rem;
      border-radius: 100px;
      border: 1px solid var(--border-subtle);
      transition: all 0.15s;
      user-select: none;
    }

    .filter-checks label:has(input:checked) {
      border-color: var(--text-muted);
    }

    .filter-checks label.fc-block:has(input:checked) { background: rgba(248,113,113,0.1); color: var(--red); border-color: rgba(248,113,113,0.3); }
    .filter-checks label.fc-redact:has(input:checked) { background: rgba(96,165,250,0.1); color: var(--blue); border-color: rgba(96,165,250,0.3); }
    .filter-checks label.fc-detect:has(input:checked) { background: rgba(251,191,36,0.1); color: var(--amber); border-color: rgba(251,191,36,0.3); }
    .filter-checks label.fc-allow:has(input:checked) { background: rgba(74,222,128,0.1); color: var(--green); border-color: rgba(74,222,128,0.3); }

    .filter-checks input[type="checkbox"] {
      display: none;
    }

    .toolbar .spacer { flex: 1; }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .btn-clear:hover {
      border-color: var(--text-muted);
      color: var(--text-secondary);
    }

    /* ── Event table ───────────────────────────── */
    .table-wrap {
      overflow-y: auto;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--bg-card);
      padding: 0.6rem 1rem;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      z-index: 1;
    }

    thead th:first-child { padding-left: 2rem; }

    tbody tr {
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.15s;
    }

    tbody tr:hover { background: var(--bg-row-hover); }

    tbody td {
      padding: 0.6rem 1rem;
      vertical-align: middle;
    }

    tbody td:first-child { padding-left: 2rem; }

    .cell-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .cell-stage {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .cell-tool {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text);
    }

    .cell-session {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Action badges ─────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-allow {
      background: rgba(74,222,128,0.1);
      color: var(--green);
      border: 1px solid rgba(74,222,128,0.2);
    }

    .badge-block {
      background: rgba(248,113,113,0.1);
      color: var(--red);
      border: 1px solid rgba(248,113,113,0.2);
    }

    .badge-detect {
      background: rgba(251,191,36,0.1);
      color: var(--amber);
      border: 1px solid rgba(251,191,36,0.2);
    }

    .badge-redact {
      background: rgba(96,165,250,0.1);
      color: var(--blue);
      border: 1px solid rgba(96,165,250,0.2);
    }

    .cell-reason {
      font-size: 0.78rem;
      color: var(--text-secondary);
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cell-latency {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: right;
    }

    /* ── Detail panel ──────────────────────────── */
    .detail-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
    }

    .detail-overlay.open { display: flex; justify-content: flex-end; }

    .detail-panel {
      width: 500px;
      max-width: 90vw;
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      padding: 2rem;
      overflow-y: auto;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .detail-panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .detail-panel .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .detail-section {
      margin-bottom: 1.25rem;
    }

    .detail-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    .detail-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--text);
      word-break: break-all;
    }

    .detail-results {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .detail-result-item {
      background: var(--bg-row);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.75rem;
    }

    .detail-result-item .name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .detail-result-item .reason {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* ── New-event flash ───────────────────────── */
    .flash { animation: flashIn 0.6s ease; }

    @keyframes flashIn {
      0% { background: rgba(255,107,94,0.08); }
      100% { background: transparent; }
    }

    /* ── Empty state ───────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      gap: 0.5rem;
    }

    .empty-state .icon { font-size: 2rem; opacity: 0.4; }

    /* ── Layout ────────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    @media (max-width: 768px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .toolbar { flex-wrap: wrap; }
      .detail-panel { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-left">
      <div class="live-dot" id="liveDot"></div>
      <h1>OpenClaw <span>Security</span></h1>
    </div>
    <div class="header-right">
      <span id="connectionStatus">connecting...</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total Events</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Allowed</div>
      <div class="stat-value green" id="statAllow">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Blocked</div>
      <div class="stat-value red" id="statBlock">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Redacted</div>
      <div class="stat-value blue" id="statRedact">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Detected</div>
      <div class="stat-value amber" id="statDetect">0</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="filter-checks">
      <label class="fc-block"><input type="checkbox" name="filterAction" value="block" checked> block</label>
      <label class="fc-redact"><input type="checkbox" name="filterAction" value="redact" checked> redact</label>
      <label class="fc-detect"><input type="checkbox" name="filterAction" value="detect" checked> detect</label>
      <label class="fc-allow"><input type="checkbox" name="filterAction" value="allow"> allow</label>
    </div>
    <select id="filterStage">
      <option value="">All stages</option>
      <option value="tool.before">tool.before</option>
      <option value="tool.after">tool.after</option>
      <option value="message.before">message.before</option>
    </select>
    <input type="text" id="filterSearch" placeholder="Search session, tool..." style="width: 180px;">
    <label>From</label>
    <input type="datetime-local" id="filterStart" step="1">
    <label>To</label>
    <input type="datetime-local" id="filterEnd" step="1">
    <div class="spacer"></div>
    <span style="font-size: 0.75rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;" id="eventCount">0 events</span>
    <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
      <input type="checkbox" id="autoScroll" checked> <span style="font-size: 0.75rem;">Auto-scroll</span>
    </label>
  </div>

  <div class="table-wrap" id="tableWrap">
    <table>
      <thead>
        <tr>
          <th>Date and Time</th>
          <th>Action</th>
          <th>Stage</th>
          <th>Tool</th>
          <th>Session</th>
          <th>Reason</th>
          <th style="text-align: right;">Latency</th>
        </tr>
      </thead>
      <tbody id="eventBody">
      </tbody>
    </table>
    <div class="empty-state" id="emptyState">
      <div class="icon">&#9671;</div>
      <div>Waiting for evaluation events...</div>
      <div style="font-size: 0.8rem;">Events will appear here in real time as the evaluation server processes requests.</div>
    </div>
  </div>
</div>

<!-- Detail panel -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel" id="detailPanel">
    <h2>
      Event Details
      <button class="close-btn" id="closeDetail">&times;</button>
    </h2>
    <div id="detailContent"></div>
  </div>
</div>

<script>
(function() {
  const tbody = document.getElementById('eventBody');
  const emptyState = document.getElementById('emptyState');
  const tableWrap = document.getElementById('tableWrap');
  const eventCount = document.getElementById('eventCount');
  const connectionStatus = document.getElementById('connectionStatus');
  const liveDot = document.getElementById('liveDot');
  const detailOverlay = document.getElementById('detailOverlay');
  const detailContent = document.getElementById('detailContent');
  const filterActionChecks = document.querySelectorAll('input[name="filterAction"]');
  const filterStage = document.getElementById('filterStage');
  const filterSearch = document.getElementById('filterSearch');
  const filterStart = document.getElementById('filterStart');
  const filterEnd = document.getElementById('filterEnd');
  const autoScroll = document.getElementById('autoScroll');

  let allEvents = [];
  let selectedEvent = null;

  // ── Stats ─────────────────────────────────────
  function updateStats(stats) {
    document.getElementById('statTotal').textContent = stats.total || 0;
    document.getElementById('statAllow').textContent = (stats.actions && stats.actions.allow) || 0;
    document.getElementById('statBlock').textContent = (stats.actions && stats.actions.block) || 0;
    document.getElementById('statRedact').textContent = (stats.actions && stats.actions.redact) || 0;
    document.getElementById('statDetect').textContent = (stats.actions && stats.actions.detect) || 0;
  }

  // ── Rendering ─────────────────────────────────
  function formatTime(ts) {
    const d = new Date(ts * 1000);
    const date = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const time = d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })
      + '.' + String(d.getMilliseconds()).padStart(3, '0');
    return date + ' ' + time;
  }

  function badgeClass(action) {
    return 'badge badge-' + action;
  }

  function getCheckedActions() {
    const checked = [];
    filterActionChecks.forEach(cb => { if (cb.checked) checked.push(cb.value); });
    return checked;
  }

  function matchesFilter(ev) {
    const checked = getCheckedActions();
    if (checked.length > 0 && !checked.includes(ev.action)) return false;
    const fs = filterStage.value;
    const q = filterSearch.value.toLowerCase();
    if (fs && ev.stage !== fs) return false;
    if (q) {
      const haystack = [ev.session_id, ev.tool_name, ...ev.reasons].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    if (filterStart.value) {
      const startTs = new Date(filterStart.value).getTime() / 1000;
      if (ev.timestamp < startTs) return false;
    }
    if (filterEnd.value) {
      const endTs = new Date(filterEnd.value).getTime() / 1000;
      if (ev.timestamp > endTs) return false;
    }
    return true;
  }

  function renderRow(ev, flash) {
    const tr = document.createElement('tr');
    if (flash) tr.classList.add('flash');
    tr.style.cursor = 'pointer';
    tr.onclick = () => showDetail(ev);
    tr.innerHTML = `
      <td class="cell-time">${formatTime(ev.timestamp)}</td>
      <td><span class="${badgeClass(ev.action)}">${ev.action}</span></td>
      <td class="cell-stage">${ev.stage}</td>
      <td class="cell-tool">${ev.tool_name || '—'}</td>
      <td class="cell-session" title="${ev.session_id}">${ev.session_id || '—'}</td>
      <td class="cell-reason" title="${ev.reasons.join('; ')}">${ev.reasons.join('; ') || '—'}</td>
      <td class="cell-latency">${ev.elapsed_ms ? ev.elapsed_ms.toFixed(1) + ' ms' : '—'}</td>
    `;
    return tr;
  }

  function renderAll() {
    tbody.innerHTML = '';
    const visible = allEvents.filter(matchesFilter);
    visible.forEach(ev => tbody.appendChild(renderRow(ev, false)));
    emptyState.style.display = visible.length === 0 ? 'flex' : 'none';
    eventCount.textContent = visible.length + ' event' + (visible.length !== 1 ? 's' : '');
  }

  function addEventRow(ev) {
    if (!matchesFilter(ev)) return;
    emptyState.style.display = 'none';
    const tr = renderRow(ev, true);
    tbody.appendChild(tr);
    if (autoScroll.checked) {
      tableWrap.scrollTop = tableWrap.scrollHeight;
    }
    const count = tbody.children.length;
    eventCount.textContent = count + ' event' + (count !== 1 ? 's' : '');
  }

  // ── Detail panel ──────────────────────────────
  function showDetail(ev) {
    selectedEvent = ev;
    let html = '';

    const fields = [
      ['Timestamp', formatTime(ev.timestamp)],
      ['Action', `<span class="${badgeClass(ev.action)}">${ev.action}</span>`],
      ['Stage', ev.stage],
      ['Tool', ev.tool_name || '—'],
      ['Session', ev.session_id || '—'],
      ['User', ev.user_id || '—'],
      ['Blocked', ev.blocked ? 'Yes' : 'No'],
      ['Redacted', ev.redacted ? 'Yes' : 'No'],
      ['Latency', ev.elapsed_ms ? ev.elapsed_ms.toFixed(2) + ' ms' : '—'],
    ];

    fields.forEach(([label, value]) => {
      html += `<div class="detail-section"><div class="detail-label">${label}</div><div class="detail-value">${value}</div></div>`;
    });

    if (ev.reasons.length > 0) {
      html += `<div class="detail-section"><div class="detail-label">Reasons</div><div class="detail-value">${ev.reasons.join('<br>')}</div></div>`;
    }

    if (ev.evaluator_results && ev.evaluator_results.length > 0) {
      const nonAllowResults = ev.evaluator_results.filter(r => r.action !== 'allow');
      if (nonAllowResults.length > 0) {
        html += `<div class="detail-section"><div class="detail-label">Evaluator Results</div><div class="detail-results">`;
        nonAllowResults.forEach(r => {
          html += `<div class="detail-result-item">
            <div class="name">${r.evaluator} <span class="${badgeClass(r.action)}" style="font-size: 0.65rem;">${r.action}</span></div>
            <div class="reason">${r.reason || '—'}</div>
          </div>`;
        });
        html += `</div></div>`;
      }
    }

    detailContent.innerHTML = html;
    detailOverlay.classList.add('open');
  }

  document.getElementById('closeDetail').onclick = () => detailOverlay.classList.remove('open');
  detailOverlay.onclick = (e) => { if (e.target === detailOverlay) detailOverlay.classList.remove('open'); };

  // ── Filters ───────────────────────────────────
  filterActionChecks.forEach(cb => { cb.onchange = renderAll; });
  filterStage.onchange = renderAll;
  filterSearch.oninput = renderAll;
  filterStart.onchange = renderAll;
  filterEnd.onchange = renderAll;

  // ── Load history ──────────────────────────────
  async function loadHistory() {
    try {
      const resp = await fetch('/dashboard/api/history?limit=500');
      const data = await resp.json();
      allEvents = (data.events || []).reverse(); // oldest first
      updateStats(data.stats || {});
      renderAll();
    } catch (e) {
      console.error('Failed to load history:', e);
    }
  }

  // ── SSE connection ────────────────────────────
  function connectSSE() {
    const es = new EventSource('/dashboard/events');

    es.onopen = () => {
      connectionStatus.textContent = 'live';
      liveDot.style.background = 'var(--green)';
      liveDot.style.boxShadow = '0 0 8px var(--green)';
    };

    es.onmessage = (msg) => {
      try {
        const ev = JSON.parse(msg.data);
        allEvents.push(ev);
        addEventRow(ev);

        // Update stats locally
        const el = document.getElementById('statTotal');
        el.textContent = parseInt(el.textContent) + 1;
        const actionEl = document.getElementById('stat' + ev.action.charAt(0).toUpperCase() + ev.action.slice(1));
        if (actionEl) actionEl.textContent = parseInt(actionEl.textContent) + 1;
      } catch (e) {
        console.error('Failed to parse SSE event:', e);
      }
    };

    es.onerror = () => {
      connectionStatus.textContent = 'reconnecting...';
      liveDot.style.background = 'var(--amber)';
      liveDot.style.boxShadow = '0 0 8px var(--amber)';
    };
  }

  // ── Init ──────────────────────────────────────
  loadHistory().then(connectSSE);
})();
</script>
